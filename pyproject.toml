[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-injector"
version = "0.6.0"
description = "Universal Bipolar Neuron Auditor, Surgical Activation Injector, Circuit Tracer, Agentic Explainer, and FastAPI/CLI Workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
huggingface = [
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.3",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
neural-injector = "neural_injector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_injector*"]